<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('오류')}"></head>
<body class="min-h-screen bg-base-200 flex items-center justify-center">
    <div class="card w-full max-w-md bg-base-100 shadow-xl">
        <div class="card-body items-center text-center">
            <h2 class="card-title text-2xl text-error">오류가 발생했습니다</h2>
            <p th:if="${errorResponse}"
               th:text="${errorResponse.errorMessage()}"
               class="text-base-content/70 mt-2"></p>
            <p th:unless="${errorResponse}"
               class="text-base-content/70 mt-2">알 수 없는 오류가 발생했습니다.</p>
            <div class="card-actions mt-4">
                <a href="/" class="btn btn-primary">홈으로</a>
            </div>
        </div>
    </div>
</body>
</html>
